[project]
name = "preview-infra"
version = "0.1.0"
description = "AWS CDK app + feature-group resolver for ephemeral preview environments"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aws-cdk-lib>=2.160,<3.0",
    "constructs>=10.3,<11.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
